<title>Bloody Angle Review Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a darkroom contact desk. Sample list on the left like a strip of negatives,
   the stage (viewer) in the middle, the verdict slip beside it. Stacks on phones. */
:root {
  --bg: #e9e7e4;          /* print paper under a safelight-free room */
  --panel: #f6f5f3;
  --ink: #17161a;
  --muted: #5d5a60;
  --line: #cbc7c3;
  --stage: #1b1a1d;       /* the stage is always dark: it shows black-and-white art */
  --stage-ink: #e8e6e3;
  --red: #b3141f;         /* Inéz's lipstick / the Serenol label: the game's only colour */
  --ok: #2f6b45;
  --warn: #9a5b07;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121114; --panel: #1a191d; --ink: #ecebe8; --muted: #9c98a0; --line: #2f2d33;
  --stage: #0b0a0c; --stage-ink: #e8e6e3; --red: #e0404a; --ok: #6cbf8a; --warn: #e0a24a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121114; --panel: #1a191d; --ink: #ecebe8; --muted: #9c98a0; --line: #2f2d33;
  --stage: #0b0a0c; --stage-ink: #e8e6e3; --red: #e0404a; --ok: #6cbf8a; --warn: #e0a24a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1440px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
.brand { display: flex; flex-direction: column; }
.brand small { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font: 800 clamp(30px, 5vw, 48px)/0.95 var(--display); letter-spacing: .01em; margin: 6px 0 0; text-transform: uppercase; text-wrap: balance; }
.brand h1 span { color: var(--red); }
.tally { font: 500 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.tally b { color: var(--ink); font-weight: 500; }

.desk { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 20px; margin-top: 20px; align-items: start; }
@media (max-width: 1100px) { .desk { grid-template-columns: 220px minmax(0, 1fr); } .slip { grid-column: 2; } }
@media (max-width: 720px) { .desk { grid-template-columns: minmax(0, 1fr); } .slip { grid-column: auto; } }

/* sample strip */
.strip { display: flex; flex-direction: column; gap: 14px; }
.ms h2 { font: 800 20px/1 var(--display); text-transform: uppercase; margin: 0; display: flex; gap: 8px; align-items: baseline; }
.ms h2 em { font: 500 11px var(--mono); font-style: normal; color: var(--muted); letter-spacing: .06em; }
.ms p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
.ms ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ms button.item { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 10px; border-radius: 3px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 500 14px/1.25 var(--body); }
.ms button.item:hover { border-color: var(--muted); }
.ms button.item[aria-current="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--red); }
.ms button.item:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.kind { font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); width: 38px; }
.pill { font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.pill.none { color: var(--muted); border-style: dashed; }
.pill.approved { color: var(--ok); }
.pill.changes { color: var(--warn); }
.pill.rejected { color: var(--red); }

/* stage */
.stage-wrap { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.stage-head h2 { font: 800 clamp(24px, 3.4vw, 34px)/1 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.stage-head p { margin: 6px 0 0; max-width: 68ch; color: var(--muted); }
.stage { background: var(--stage); color: var(--stage-ink); border-radius: 4px; position: relative; overflow: hidden; min-height: 320px; display: flex; flex-direction: column; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
.stage img.art { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; background: var(--stage); }
.stage canvas { display: block; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; }
.controls { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 12px; border-top: 1px solid #2c2a2f; font: 500 12px var(--mono); color: #bdb9c0; }
.controls .seg { display: inline-flex; border: 1px solid #3a383e; border-radius: 3px; overflow: hidden; }
.controls .seg button { background: transparent; color: #d8d5da; border: 0; padding: 7px 10px; font: inherit; cursor: pointer; }
.controls .seg button[aria-pressed="true"] { background: var(--stage-ink); color: #111; }
.controls label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.controls input[type=range] { width: 110px; accent-color: #e0404a; }
.controls input[type=checkbox] { accent-color: #e0404a; }
.audio-list { position: relative; z-index: 1; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; }
.audio-list blockquote { margin: 0 0 6px; font: 500 clamp(18px, 2.4vw, 24px)/1.35 var(--body); font-style: italic; color: var(--stage-ink); max-width: 46ch; }
.track { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; align-items: center; }
.track span { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #bdb9c0; }
.track audio { width: 100%; max-width: 100%; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 500 12px var(--mono); color: var(--muted); }
.meta a { color: var(--ink); }
.lookfor { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; }
.lookfor h3 { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lookfor ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* verdict slip */
.slip { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ink); border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 720px) { .slip { position: static; } }
.slip h3 { font: 800 20px/1 var(--display); text-transform: uppercase; margin: 0; }
.verdicts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.verdicts button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 4px; border-radius: 3px; cursor: pointer; font: 600 13px/1.1 var(--body); }
.verdicts button[aria-pressed="true"][data-v="approved"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.verdicts button[aria-pressed="true"][data-v="changes"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.verdicts button[aria-pressed="true"][data-v="rejected"] { background: var(--red); border-color: var(--red); color: #fff; }
.slip label { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slip textarea { width: 100%; min-height: 140px; resize: vertical; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; padding: 10px; font: 15px/1.5 var(--body); }
.slip .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.save { background: var(--ink); color: var(--bg); border: 0; border-radius: 3px; padding: 10px 16px; font: 600 14px var(--body); cursor: pointer; }
.save:disabled { opacity: .45; cursor: default; }
.status { font: 500 12px var(--mono); color: var(--muted); }
.status.err { color: var(--red); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Matt Long · Case 1</small>
      <h1>The Bloody Angle <span>/</span> Review Desk</h1>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>

  <div class="desk">
    <nav class="strip" id="strip" aria-label="Samples"></nav>

    <main class="stage-wrap">
      <div class="stage-head">
        <h2 id="s-title">Loading samples…</h2>
        <p id="s-about"></p>
      </div>
      <div class="stage" id="stage"></div>
      <div class="meta" id="s-meta"></div>
      <section class="lookfor" id="s-look" hidden>
        <h3>What to look at</h3>
        <ul id="s-look-list"></ul>
      </section>
    </main>

    <aside class="slip" aria-labelledby="slip-h">
      <h3 id="slip-h">Your verdict</h3>
      <div class="verdicts" role="group" aria-label="Verdict">
        <button type="button" data-v="approved" aria-pressed="false">Approve</button>
        <button type="button" data-v="changes" aria-pressed="false">Changes</button>
        <button type="button" data-v="rejected" aria-pressed="false">Reject</button>
      </div>
      <label for="note">Notes for Claude</label>
      <textarea id="note" placeholder="What works, what doesn't, what to try next."></textarea>
      <div class="row">
        <button class="save" id="save" type="button">Save verdict</button>
        <span class="status" id="save-status" aria-live="polite">Connecting…</span>
      </div>
      <p class="hint">Claude reads these verdicts before the next round of work.</p>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const VERDICT_LABEL = { approved: 'Approved', changes: 'Changes', rejected: 'Rejected' };
  let manifest = null, current = null, reviews = {}, db = null, draft = { status: null };
  let stopAnim = null;

  // ---------- data ----------
  fetch('samples.json').then(r => r.json()).then(m => { manifest = m; renderStrip(); route(); })
    .catch(() => { $('s-title').textContent = 'Samples could not be loaded'; });

  (async () => {
    const timer = setTimeout(() => setStatus('Saved verdicts can\'t be reached yet.', true), 10000);
    try { db = await window.claude?.use?.('db'); } catch { db = null; }
    if (!db) { clearTimeout(timer); setStatus('Verdicts can\'t be saved in this view.', true); $('save').disabled = true; return; }
    db.collection('reviews').onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const next = {};
      snap.docs.forEach(d => { next[d.id] = d.data(); });
      reviews = next;
      if (!snap.metadata.fromCache) setStatus('');
      renderStrip(); renderSlip(false);
    }, (e) => { clearTimeout(timer); setStatus('Verdicts stopped syncing (' + e.code + '). Reload to retry.', true); });
  })();

  function setStatus(text, err) { const s = $('save-status'); s.textContent = text; s.classList.toggle('err', !!err); }

  // ---------- strip ----------
  function renderStrip() {
    if (!manifest) return;
    const nav = $('strip'); nav.textContent = '';
    let counts = { approved: 0, changes: 0, rejected: 0, none: 0 };
    manifest.milestones.forEach(ms => {
      const sec = document.createElement('section'); sec.className = 'ms';
      const h = document.createElement('h2'); h.textContent = ms.label + ' ' + ms.title;
      const em = document.createElement('em'); em.textContent = ms.date; h.appendChild(em);
      const p = document.createElement('p'); p.textContent = ms.summary;
      const ol = document.createElement('ol');
      manifest.samples.filter(s => s.milestone === ms.id).forEach(s => {
        const st = reviews[s.id]?.status;
        counts[st || 'none']++;
        const li = document.createElement('li');
        const b = document.createElement('button'); b.className = 'item'; b.type = 'button';
        b.setAttribute('aria-current', current?.id === s.id ? 'true' : 'false');
        const k = document.createElement('span'); k.className = 'kind'; k.textContent = s.kind;
        const t = document.createElement('span'); t.textContent = s.title;
        const pill = document.createElement('span'); pill.className = 'pill ' + (st || 'none');
        pill.textContent = st ? VERDICT_LABEL[st] : 'To review';
        b.append(k, t, pill);
        b.addEventListener('click', () => { location.hash = s.id; });
        li.appendChild(b); ol.appendChild(li);
      });
      sec.append(h, p, ol); nav.appendChild(sec);
    });
    const tally = $('tally'); tally.textContent = '';
    [['To review', counts.none], ['Approved', counts.approved], ['Changes', counts.changes], ['Rejected', counts.rejected]].forEach(([l, n]) => {
      const s = document.createElement('span'); const b = document.createElement('b'); b.textContent = n;
      s.append(b, ' ' + l); tally.appendChild(s);
    });
  }

  // ---------- routing ----------
  window.addEventListener('hashchange', route);
  function route() {
    if (!manifest) return;
    const id = location.hash.slice(1);
    const s = manifest.samples.find(x => x.id === id) || manifest.samples[0];
    if (current?.id === s.id) return;
    current = s; showSample(s); renderStrip(); renderSlip(true);
  }

  // ---------- stage ----------
  function showSample(s) {
    if (stopAnim) { stopAnim(); stopAnim = null; }
    $('s-title').textContent = s.title;
    $('s-about').textContent = s.about || '';
    const stage = $('stage'); stage.textContent = '';
    const meta = $('s-meta'); meta.textContent = '';
    if (s.kind === 'image') {
      const img = document.createElement('img'); img.className = 'art'; img.src = s.src; img.alt = s.title;
      stage.appendChild(img);
      addLink(meta, 'Open full size', s.src);
      if (s.full) addLink(meta, 'Reference at full size', s.full);
    } else if (s.kind === 'audio') {
      const box = document.createElement('div'); box.className = 'audio-list';
      if (s.line) { const q = document.createElement('blockquote'); q.textContent = '“' + s.line + '”'; box.appendChild(q); }
      s.tracks.forEach(t => {
        const row = document.createElement('div'); row.className = 'track';
        const l = document.createElement('span'); l.textContent = t.label;
        const a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; a.src = t.src;
        a.addEventListener('play', () => stage.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }));
        row.append(l, a); box.appendChild(row);
      });
      stage.appendChild(box);
      if (s.credit && /^https:\/\//.test(s.credit)) addLink(meta, 'Source recording', s.credit);
    } else if (s.kind === 'rig') {
      stopAnim = mountRig(stage, s.rig, s.mesh);
      addLink(meta, 'Rig file', s.rig);
    }
    const list = $('s-look-list'); list.textContent = '';
    (s.lookFor || []).forEach(t => { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); });
    $('s-look').hidden = !(s.lookFor && s.lookFor.length);
  }
  function addLink(meta, text, href) {
    const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = text; meta.appendChild(a);
  }

  // ---------- verdict slip ----------
  document.querySelectorAll('.verdicts button').forEach(b => b.addEventListener('click', () => {
    draft.status = draft.status === b.dataset.v ? null : b.dataset.v; paintVerdicts();
  }));
  function paintVerdicts() {
    document.querySelectorAll('.verdicts button').forEach(b => b.setAttribute('aria-pressed', String(draft.status === b.dataset.v)));
  }
  function renderSlip(force) {
    if (!current) return;
    const saved = reviews[current.id];
    const note = $('note');
    // Don't clobber what the viewer is typing when a snapshot arrives.
    if (force || document.activeElement !== note) {
      draft.status = saved?.status || null;
      note.value = saved?.note || '';
      paintVerdicts();
    }
    if (saved?.updatedAt && !$('save-status').classList.contains('err')) {
      setStatus('Saved ' + new Date(saved.updatedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }));
    } else if (!$('save-status').classList.contains('err') && db) setStatus('Not reviewed yet');
  }
  let saving = false;
  $('save').addEventListener('click', async () => {
    if (!db || !current || saving) return;
    saving = true; $('save').disabled = true; setStatus('Saving…');
    const body = { status: draft.status, note: $('note').value.trim(), title: current.title, milestone: current.milestone, updatedAt: new Date().toISOString() };
    try { await db.doc('reviews/' + current.id).set(body); setStatus('Saved'); }
    catch (e) {
      setStatus(e?.code === 'invalid_argument' ? 'You can view this desk but not save verdicts.' : 'Not saved: ' + (e?.message || 'try again in a moment.'), true);
    } finally { saving = false; $('save').disabled = !db; }
  });

  // ---------- cut-out rig player ----------
  // Mesh (default): whole drawings deformed by bones on triangle grids (WebGL), driven by a
  // motion system: gait curves from walking studies, planted feet with root motion, a two-bone
  // reach, a stabilised head with lag, cloth springs driven by acceleration, and pose blending.
  // Pieces: the rigid cut-out pieces (canvas 2D), kept for comparison.
  function mountRig(stage, rigUrl, meshUrl) {
    const box = document.createElement('div'); box.style.cssText = 'position:relative;width:100%;aspect-ratio:4/3;max-width:100%';
    const bg = document.createElement('canvas'), gl_c = document.createElement('canvas'), fx = document.createElement('canvas');
    [bg, gl_c, fx].forEach(c => { c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto'; box.appendChild(c); });
    fx.setAttribute('aria-label', 'Animated cut-out puppet');
    const controls = document.createElement('div'); controls.className = 'controls';
    const mkSeg = (label, items, cur, on) => {
      const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', label);
      items.forEach(n => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.setAttribute('aria-pressed', String(n === cur));
        b.addEventListener('click', () => { on(n); seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }); seg.appendChild(b); });
      return seg;
    };
    let anim = 'Walk', mode = meshUrl ? 'Mesh' : 'Pieces', speed = 1, showJoints = false, showMesh = false, paused = false;
    const ANIMS = meshUrl ? ['Rest', 'Idle', 'Walk', 'Gesture', 'Reach'] : ['Rest', 'Idle', 'Walk', 'Gesture'];
    const animSeg = mkSeg('Animation', ANIMS, anim, n => { setAnim(n); });
    const modeSeg = meshUrl ? mkSeg('Renderer', ['Mesh', 'Pieces'], mode, n => { mode = n; }) : null;
    const sp = document.createElement('label'); sp.textContent = 'Speed ';
    const range = document.createElement('input'); range.type = 'range'; range.min = '0.1'; range.max = '1.5'; range.step = '0.05'; range.value = '1'; range.id = 'rig-speed';
    range.addEventListener('input', () => { speed = +range.value; }); sp.appendChild(range);
    const mkCheck = (id, text, on) => { const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox'; c.id = id; c.addEventListener('change', () => on(c.checked)); l.append(c, ' ' + text); return l; };
    const pb = document.createElement('button'); pb.type = 'button'; pb.textContent = 'Pause';
    pb.style.cssText = 'background:transparent;color:#d8d5da;border:1px solid #3a383e;border-radius:3px;padding:7px 10px;font:inherit;cursor:pointer';
    pb.addEventListener('click', () => { paused = !paused; pb.textContent = paused ? 'Play' : 'Pause'; });
    controls.append(animSeg); if (modeSeg) controls.append(modeSeg);
    controls.append(sp, mkCheck('rig-joints', 'Show joints', v => { showJoints = v; }));
    if (meshUrl) controls.append(mkCheck('rig-mesh', 'Show mesh', v => { showMesh = v; }));
    controls.append(pb);
    stage.append(box, controls);

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const base = rigUrl.replace(/[^/]+$/, '');
    const loadImg = (f) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = base + f; });
    let rig = null, mesh = null, imgs = {}, raf = 0, alive = true, t = 0, last = performance.now();
    let gl = null, prog = null, glMeshes = [];

    // ---- animation state: blending, gait phase, root motion, springs
    let animStart = 0, prevPose = null, blendFrom = null, blendStart = -1;
    const BLEND = 0.45;
    let baseX = 0;
    function setAnim(n) { blendFrom = prevPose; blendStart = t; anim = n; animStart = t; if (prevPose && typeof prevPose.hx === 'number') baseX = prevPose.hx; }
    if (reduce) { anim = 'Rest'; animSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === 'Rest'))); }
    let camX = 0;
    const head = { a: 0, v: 0 };

    Promise.all([fetch(rigUrl).then(r => r.json()), meshUrl ? fetch(meshUrl).then(r => r.json()) : null]).then(async ([r, m]) => {
      rig = r;
      const files = [...new Set(r.parts.map(p => p.file).concat(m ? m.meshes.map(x => x.file) : []))];
      const byFile = {}; (await Promise.all(files.map(loadImg))).forEach((im, i) => { byFile[files[i]] = im; });
      r.parts.forEach(p => { imgs[p.id] = byFile[p.file]; });
      r.byId = Object.fromEntries(r.parts.map(p => [p.id, p]));
      if (m) { mesh = m; prepMesh(m); setupGL(byFile); window.__rigDebug = { pose, boneMatrices, mesh: m, apply, G }; }   // used by tools/check-walk.js
      if (!gl) { mode = 'Pieces'; if (modeSeg) modeSeg.remove(); }
      raf = requestAnimationFrame(tick);
    });

    // ---- skeleton helpers (angles in radians, clockwise positive; he faces right)
    const D = Math.PI / 180;
    const segAngle = (a, b) => Math.atan2(-(b[0] - a[0]), b[1] - a[1]);    // angle of a->b from straight down
    let REST = {}, LEN = {};
    function prepMesh(m) {

            const k = i * 2, j = m.jiggle[i];
            if (dt > 0 && sp.age > 2) {
              const ax = (x - 2 * sp.p1[k] + sp.p0[k]) / (dt * dt), ay = (y - 2 * sp.p1[k + 1] + sp.p0[k + 1]) / (dt * dt);
              sp.v[k] += (-K * sp.o[k] - Cd * sp.v[k] - INERTIA * ax) * dt; sp.v[k + 1] += (-K * sp.o[k + 1] - Cd * sp.v[k + 1] - INERTIA * ay) * dt;
              sp.o[k] = Math.max(-CLAMP, Math.min(CLAMP, sp.o[k] + sp.v[k] * dt)); sp.o[k + 1] = Math.max(-CLAMP, Math.min(CLAMP, sp.o[k + 1] + sp.v[k + 1] * dt));
            }
            if (dt > 0) { sp.p0[k] = sp.p1[k]; sp.p1[k] = x; sp.p0[k + 1] = sp.p1[k + 1]; sp.p1[k + 1] = y; }
            x += sp.o[k] * j; y += sp.o[k + 1] * j;
          }
          const s2 = toScreen(x, y); out[i * 2] = s2[0]; out[i * 2 + 1] = s2[1];
        }
        if (sp && dt > 0) sp.age++;
        gl.bindBuffer(gl.ARRAY_BUFFER, gm.pos); gl.bufferData(gl.ARRAY_BUFFER, out, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, gm.uv); gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);
        gl.bindTexture(gl.TEXTURE_2D, gm.tex); gl.uniform1f(gl.getUniformLocation(prog, 'uShade'), m.shade || 1);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gm.idx); gl.drawElements(gl.TRIANGLES, m.triangles.length, gl.UNSIGNED_SHORT, 0);
        if (showMesh && !m.shade) {
          f.strokeStyle = 'rgba(224,64,74,.32)'; f.lineWidth = 0.6 * dpr; f.beginPath();
          for (let q = 0; q < m.triangles.length; q += 3) {
            const a = m.triangles[q] * 2, b = m.triangles[q + 1] * 2, c = m.triangles[q + 2] * 2;
            f.moveTo(out[a], out[a + 1]); f.lineTo(out[b], out[b + 1]); f.lineTo(out[c], out[c + 1]); f.closePath();
          }
          f.stroke();
        }
      });
      // reach target: a brass knob or marker the hand goes for
      if (P.reach) {
        const tp = toScreen(J.hip[0] + P.reachTarget[0] + root.x, J.hip[1] + P.reachTarget[1] + root.y);
        f.beginPath(); f.arc(tp[0], tp[1], 9 * dpr, 0, Math.PI * 2); f.fillStyle = 'rgba(200,180,120,.9)'; f.fill();
        f.lineWidth = 1.5 * dpr; f.strokeStyle = 'rgba(0,0,0,.6)'; f.stroke();
      }
      if (showJoints) {
        mesh.bones.forEach((b, i) => {
          if (/Back$/.test(b.id)) return;
          const p = toScreen(...apply(Wb[i], b.joint));
          f.beginPath(); f.arc(p[0], p[1], 5 * dpr, 0, Math.PI * 2); f.fillStyle = '#e0404a'; f.fill(); f.lineWidth = 1.5 * dpr; f.strokeStyle = '#fff'; f.stroke();
        });
      }
    }

    // ---- rigid pieces (comparison)
    function posePieces(name, tt) {
      const w = tt * 2 * Math.PI, s = Math.sin;
      if (name === 'Walk') {
        const leg = (ph) => ({ thigh: -22 * Math.sin(2 * Math.PI * ph) * D, shin: (3 + 34 * Math.pow(Math.max(0, Math.cos(2 * Math.PI * ph)), 2)) * D });
        const ph = (tt * 0.6) % 1, a = leg(ph), b = leg((ph + 0.5) % 1), arm = Math.sin(2 * Math.PI * ph);
        return { lean: 1.5 * D, thigh: a.thigh, shin: a.shin, thighBack: b.thigh, shinBack: b.shin,
          upperArm: 16 * arm * D, foreArm: (-8 - 14 * Math.max(0, -arm)) * D, upperArmBack: -16 * arm * D, foreArmBack: (-8 - 14 * Math.max(0, arm)) * D };
      }
      if (name === 'Gesture') { const k = (1 - Math.cos(w * 0.35)) / 2; return { upperArm: -48 * D * k, foreArm: -78 * k * D, head: -5 * k * D }; }
      if (name === 'Idle') { const b = s(w * 0.35); return { lean: b * 0.6 * D, upperArm: b * 2.5 * D, head: s(w * 0.35 + .6) * 1.8 * D }; }
      return {};
    }
    function drawPieces(ctx, f, W, H, dpr, floorY, scale) {
      if (gl) { gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, floorY, W, H - floorY);
      const P = posePieces(anim, t), J = rig.joints;
      const rotv = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
      const drop = (th, sh) => { const a1 = (P.lean || 0) + (P[th] || 0); return rotv([J.knee[0] - J.hip[0], J.knee[1] - J.hip[1]], a1)[1] + rotv([J.ankle[0] - J.knee[0], J.ankle[1] - J.knee[1]], a1 + (P[sh] || 0))[1]; };
      const lift = (J.ankle[1] - J.hip[1]) - Math.max(drop('thigh', 'shin'), drop('thighBack', 'shinBack'));
      const hipX = W / 2, hipY = floorY - rig.groundY * scale + lift * scale;
      const joints = [];
      rig.parts.slice().sort((a, b) => a.z - b.z).forEach(p => {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(hipX, hipY); ctx.scale(scale, scale);
        const chain = []; let q = p; while (q) { chain.unshift(q); q = q.parent ? rig.byId[q.parent] : null; }
        chain.forEach((c, i) => {
          if (i === 0) { ctx.rotate(P.lean || 0); return; }
          const par = chain[i - 1]; ctx.translate(c.at[0] - par.pivot[0], c.at[1] - par.pivot[1]);
          ctx.rotate(c.follow ? c.follow.k * (P[c.follow.of] || 0) : (P[c.id] || 0));
        });
        const im = imgs[p.id];
        if (p.shade) ctx.filter = 'brightness(' + p.shade + ')';
        if (im && im.naturalWidth) ctx.drawImage(im, -p.pivot[0], -p.pivot[1]);
        ctx.filter = 'none';
        if (showJoints && !p.shade && p.parent && !p.follow) { const m = ctx.getTransform(); joints.push([m.e, m.f]); }
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (showJoints) joints.forEach(([x, y]) => { f.beginPath(); f.arc(x, y, 5 * dpr, 0, Math.PI * 2); f.fillStyle = '#e0404a'; f.fill(); f.lineWidth = 1.5 * dpr; f.strokeStyle = '#fff'; f.stroke(); });
    }
    return () => { alive = false; cancelAnimationFrame(raf); };
  }
})();
